services:
  db:
    image: mysql:latest
    container_name: c_mysql
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red_db
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: c_phpmyadmin
    ports:
      - 8881:80
    environment:
      PMA_HOST: c_mysql
    networks:
      - red_db
    depends_on:
      - db
networks:
  red_db:
volumes:
  mysql_data:
 